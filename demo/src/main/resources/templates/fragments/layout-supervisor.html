<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(activeTab, title)">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>

<div class="app-wrapper">
    <!-- SIDEBAR SUPERVISOR (solo 2 opciones) -->
    <aside class="app-sidebar" id="appSidebar">
        <div>
            <div class="sidebar-header">
                <a th:href="@{/supervisor/embarque}" class="brand-container">
                    <div class="brand-logo-icon">
                        <img th:src="@{/img/favicon.png}" alt="Los Chaskis" class="brand-logo-img">
                    </div>
                    <div>
                        <div class="brand-text-title">Los <span>Chaskis</span></div>
                        <span class="brand-text-slogan">CONECTANDO CAMINOS, UNIENDO DESTINOS.</span>
                    </div>
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a th:href="@{/supervisor/embarque}" class="sidebar-nav-link" th:classappend="${activeTab == 'embarque'} ? 'active'">
                        <i class="bi bi-bus-front"></i><span>Embarque / Abordaje</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a th:href="@{/supervisor/plano-asientos}" class="sidebar-nav-link" th:classappend="${activeTab == 'plano'} ? 'active'">
                        <i class="bi bi-grid-3x3-gap"></i><span>Plano de Asientos</span>
                    </a>
                </li>
                <li class="sidebar-nav-item mt-3">
                    <a th:href="@{/logout}" class="sidebar-nav-link">
                        <i class="bi bi-box-arrow-right"></i><span>Cerrar Sesión</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-user">
            <div class="user-avatar-wrap">
                <div class="user-avatar-img" th:text="${usuario != null ? usuario.iniciales : 'SU'}">SU</div>
                <div class="user-status-dot" title="En línea"></div>
            </div>
            <div>
                <div class="user-info-name" th:text="${usuario != null ? usuario.nombre : 'Supervisor'}">Supervisor</div>
                <div class="user-info-role" th:text="${usuario != null ? usuario.rol.displayName : 'Supervisor'}">Supervisor</div>
                <div class="user-info-status"><i class="bi bi-geo-alt-fill"></i>
                    <span th:text="${usuario != null ? usuario.terminal : 'Terminal Piura'}">Terminal Piura</span></div>
            </div>
        </div>
    </aside>

    <main class="app-main">
        <div class="d-lg-none d-flex justify-content-between align-items-center mb-3 p-2 bg-white rounded shadow-sm">
            <span class="fw-bold text-dark"><i class="bi bi-lightning-charge-fill text-warning me-1"></i>Los Chaskis</span>
            <button class="btn btn-sm btn-outline-dark" onclick="document.getElementById('appSidebar').classList.toggle('show')">
                <i class="bi bi-list fs-5"></i>
            </button>
        </div>

        <div th:replace="~{:: content}"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

</body>
</html>
