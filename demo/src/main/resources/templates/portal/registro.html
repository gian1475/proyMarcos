<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear Cuenta')}"></head>
<body>

    <header th:replace="~{fragments/componentes :: portalTopbar(false)}"></header>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-3">
                            <i class="bi bi-person-plus-fill fs-2"></i>
                        </div>
                        <h1 class="fw-bold text-dark fs-3 mb-1">Crear Cuenta</h1>
                        <p class="text-muted small mb-0">Regístrate para agilizar tus compras futuras</p>
                    </div>

                    <div th:if="${errores}" class="alert alert-danger border-0 small">
                        <ul class="mb-0 ps-3">
                            <li th:each="e : ${errores}" th:text="${e}">Error</li>
                        </ul>
                    </div>

                    <form th:action="@{/portal/registro}" th:object="${cliente}" method="post" id="formRegistro" novalidate>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Nombres</label>
                                <input type="text" class="form-control" th:field="*{nombres}" placeholder="Nombres completos" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Apellidos</label>
                                <input type="text" class="form-control" th:field="*{apellidos}" placeholder="Apellidos completos" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-5">
                                <label class="form-label small fw-bold text-secondary">Tipo de Documento</label>
                                <select class="form-select" th:field="*{tipoDocumento}" id="tipoDocumento">
                                    <option value="DNI">DNI</option>
                                    <option value="CE">Carnet de Extranjería</option>
                                    <option value="Pasaporte">Pasaporte</option>
                                </select>
                            </div>
                            <div class="col-md-7">
                                <label class="form-label small fw-bold text-secondary">N° Documento</label>
                                <input type="text" class="form-control" th:field="*{numeroDocumento}" id="numeroDocumento" placeholder="8 dígitos numéricos" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-5">
                                <label class="form-label small fw-bold text-secondary">Teléfono</label>
                                <input type="tel" class="form-control" th:field="*{telefono}" placeholder="987654321" pattern="\d{9}" maxlength="9" required>
                            </div>
                            <div class="col-md-7">
                                <label class="form-label small fw-bold text-secondary">Correo Electrónico</label>
                                <input type="email" class="form-control" th:field="*{correo}" placeholder="ejemplo@correo.com" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Contraseña</label>
                                <input type="password" class="form-control" name="contrasena" id="contrasena" placeholder="Mínimo 8 caracteres" minlength="8" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Confirmar Contraseña</label>
                                <input type="password" class="form-control" name="confirmarContrasena" id="confirmarContrasena" placeholder="Repite tu contraseña" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-chaski-gold w-100 py-3 fs-6 justify-content-center text-uppercase fw-bold">
                            <i class="bi bi-person-check"></i> Crear Cuenta
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small">
                        <a th:href="@{/portal/pago}" class="text-muted text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> Volver y continuar como invitado
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/componentes :: portalFooter('Atención al Cliente: (01) 418-1111')}"></footer>

<script>
    // Validación en el navegador (el backend vuelve a validar todo)
    const LONGITUD = { DNI: 8, CE: 9, Pasaporte: 12 };
    const form = document.getElementById('formRegistro');
    const tipo = document.getElementById('tipoDocumento');
    const doc = document.getElementById('numeroDocumento');
    const pass = document.getElementById('contrasena');
    const confirmar = document.getElementById('confirmarContrasena');

    function ajustarDocumento() {
        const n = LONGITUD[tipo.value];
        doc.maxLength = n;
        doc.pattern = tipo.value === 'DNI' ? '\\d{8}' : '.{' + n + '}';
        doc.placeholder = n + (tipo.value === 'DNI' ? ' dígitos numéricos' : ' caracteres');
    }

    tipo.addEventListener('change', ajustarDocumento);
    ajustarDocumento();

    form.addEventListener('submit', function (e) {
        confirmar.setCustomValidity(pass.value === confirmar.value ? '' : 'Las contraseñas no coinciden');
        if (!form.checkValidity()) {
            e.preventDefault();
            form.classList.add('was-validated');
        }
    });
</script>

</body>
</html>
